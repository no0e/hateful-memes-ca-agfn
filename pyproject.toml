[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-agfn"
version = "2.0.0"
description = "Clash-aware adaptive gated fusion for hateful meme detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40,<6",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
data = ["kagglehub>=0.3"]
dev = ["pytest>=7.4", "ruff>=0.5", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["ca_agfn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: downloads a tiny model from the Hugging Face Hub",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
